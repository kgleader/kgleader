<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" role="img" aria-labelledby="title desc">
  <title id="title">Meerim Akmatova — Independent App Creator</title>
  <desc id="desc">Dark navy professional GitHub profile banner with turquoise accent, product-building message, and abstract iPhone app illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101B2F"/>
      <stop offset="55%" stop-color="#13233A"/>
      <stop offset="100%" stop-color="#0C2730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#68E1C6"/>
      <stop offset="100%" stop-color="#6EA9FF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#253A52"/>
      <stop offset="100%" stop-color="#172B40"/>
    </linearGradient>
    <clipPath id="canvas"><rect width="1400" height="380" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1400" height="380" fill="url(#bg)"/>
    <path d="M 0 374 L 635 374" stroke="#68E1C6" stroke-width="5" opacity="0.9"/>
    <circle cx="1270" cy="10" r="290" stroke="#68E1C6" stroke-opacity="0.13" stroke-width="2" fill="none"/>
    <circle cx="1254" cy="10" r="222" stroke="#6EA9FF" stroke-opacity="0.14" stroke-width="2" fill="none"/>
    <circle cx="1260" cy="10" r="145" fill="#5BDFC3" fill-opacity="0.035"/>
    <path d="M 808 0 C 920 95 934 228 840 380" stroke="#6EA9FF" stroke-opacity="0.09" stroke-width="40" fill="none"/>

    <rect x="86" y="55" width="33" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="132" y="65" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" letter-spacing="3.1" fill="#8EEBD6">PRODUCT-MINDED • iOS-FOCUSED</text>
    <text x="82" y="148" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="61" letter-spacing="-1.8" fill="#F5FAFF">Meerim Akmatova</text>
    <text x="86" y="202" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#D5E1F0">Independent App Creator &amp; Product Builder</text>
    <text x="87" y="241" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#9FB3C7">Building useful iPhone apps — from idea to release.</text>

    <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="0.6">
      <rect x="86" y="276" width="247" height="43" rx="21.5" fill="#193A43" stroke="#396D73"/>
      <circle cx="109" cy="297.5" r="5" fill="#68E1C6"/>
      <text x="125" y="303" fill="#A8F0DC">PRODUCT THINKING</text>

      <rect x="349" y="276" width="239" height="43" rx="21.5" fill="#21324B" stroke="#496181"/>
      <circle cx="372" cy="297.5" r="5" fill="#83B2FF"/>
      <text x="388" y="303" fill="#C4D9FE">AI-ASSISTED BUILD</text>

      <rect x="604" y="276" width="235" height="43" rx="21.5" fill="#263A41" stroke="#557879"/>
      <circle cx="627" cy="297.5" r="5" fill="#EAC784"/>
      <text x="643" y="303" fill="#E7D7B2">TEST • SHIP • REFINE</text>
    </g>

    <!-- Decorative product interface: conceptual illustration, not an app screenshot. -->
    <g transform="translate(1032,49)">
      <rect x="0" y="0" width="248" height="307" rx="31" fill="#101B2E" stroke="#7D9CB5" stroke-opacity="0.6" stroke-width="3"/>
      <rect x="12" y="12" width="224" height="283" rx="23" fill="url(#screen)"/>
      <rect x="87" y="13" width="73" height="13" rx="7" fill="#101B2E"/>
      <text x="29" y="65" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#E9F3FE">Your overview</text>
      <text x="29" y="102" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#F8FBFF">Money trends</text>
      <text x="29" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9FB3C7">A clearer view, every day</text>
      <rect x="29" y="145" width="190" height="99" rx="13" fill="#15293F" stroke="#3C5868" stroke-opacity="0.75"/>
      <path d="M 46 220 L 73 203 L 99 211 L 126 186 L 155 192 L 176 169 L 202 159" fill="none" stroke="#68E1C6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 46 220 L 73 203 L 99 211 L 126 186 L 155 192 L 176 169 L 202 159 L 202 228 L 46 228 Z" fill="#68E1C6" fill-opacity="0.09"/>
      <circle cx="202" cy="159" r="5" fill="#68E1C6"/>
      <rect x="30" y="262" width="57" height="10" rx="5" fill="#6EA9FF" opacity="0.7"/>
      <rect x="99" y="262" width="43" height="10" rx="5" fill="#68E1C6" opacity="0.7"/>
      <rect x="154" y="262" width="55" height="10" rx="5" fill="#EAC784" opacity="0.65"/>
    </g>
  </g>
</svg>
